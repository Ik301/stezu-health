<style>
/* Layout: a toolbar, then the phone beside a short "what changed" panel; the phone uses the Ingest design-system tokens. */
:root {
  --page: #f4f4f4; --ground: #e6e6e6; --surface: #efefef; --raised: #ffffff; --edge: #ffffff;
  --ink: #0b0b0b; --muted: #5e5e5e; --invert: #0b0b0b; --on-invert: #ffffff; --on-invert-muted: #9c9c9c;
  --track: #d4d4d4; --sample: #a3a3a3; --focus: #0b0b0b;
  --energy: #a04b17; --protein: #0e6b66;
  --camera: #000000; --on-camera: #ffffff; --scrim: rgba(0, 0, 0, 0.55); --plate: #d9d9d9; --plate-rim: #c4c4c4; --food-a: #d9a659; --food-b: #5a9a4d; --food-c: #f2efe6; --sleep-deep: #1b2f5c; --sleep-core: #3a64a8; --sleep-rem: #6f95d1; --sleep-awake: #b8650a;
  --bezel: #cfcfcf; --rest-bg: rgba(255, 255, 255, 0.12); --toast: #0b0b0b; --on-toast: #ffffff;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0a0a0a; --ground: #111111; --surface: #1a1a1a; --raised: #262626; --edge: #2c2c2c;
  --ink: #f2f2f2; --muted: #a3a3a3; --invert: #f2f2f2; --on-invert: #0b0b0b; --on-invert-muted: #5e5e5e;
  --track: #2e2e2e; --sample: #5c5c5c; --focus: #f2f2f2;
  --energy: #e8954f; --protein: #5cc3ba; --sleep-deep: #4a6fb8; --sleep-core: #7ba3e0; --sleep-rem: #b5d0f5; --sleep-awake: #e3a33b;
  --bezel: #2a2a2a; --rest-bg: rgba(0, 0, 0, 0.07); --toast: #f2f2f2; --on-toast: #0b0b0b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #0a0a0a; --ground: #111111; --surface: #1a1a1a; --raised: #262626; --edge: #2c2c2c;
  --ink: #f2f2f2; --muted: #a3a3a3; --invert: #f2f2f2; --on-invert: #0b0b0b; --on-invert-muted: #5e5e5e;
  --track: #2e2e2e; --sample: #5c5c5c; --focus: #f2f2f2;
  --energy: #e8954f; --protein: #5cc3ba; --sleep-deep: #4a6fb8; --sleep-core: #7ba3e0; --sleep-rem: #b5d0f5; --sleep-awake: #e3a33b;
  --bezel: #2a2a2a; --rest-bg: rgba(0, 0, 0, 0.07); --toast: #f2f2f2; --on-toast: #0b0b0b; color-scheme: dark; }

body { background: var(--page); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
.page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; max-width: 1040px; margin: 0 auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }

/* toolbar */
.tool { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 18px; font-size: 13px; }
.tool h1 { font-size: 20px; font-weight: 600; margin: 0 8px 0 0; letter-spacing: -0.2px; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--raised); box-shadow: 0 0 0 1px var(--track); }
.seg button { min-height: 32px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--invert); color: var(--on-invert); }
.tool .lab { color: var(--muted); font-size: 12px; }
.wrap { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }

/* phone */
.phone { width: 377px; max-width: 100%; height: 780px; border-radius: 46px; background: var(--ground); position: relative; overflow: hidden; flex: none; box-shadow: 0 0 0 8px var(--bezel); }
.status { position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; padding: 0 30px; font-size: 14px; font-weight: 600; z-index: 6; background: var(--ground); }
.scr { position: absolute; inset: 40px 0 0; overflow-y: auto; padding: 4px 16px 120px; scrollbar-width: none; }
.scr::-webkit-scrollbar { display: none; }
.scr.home { padding-bottom: 20px; display: flex; flex-direction: column; }
.bar { display: flex; justify-content: space-between; align-items: center; min-height: 44px; margin-bottom: 4px; }
.icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; }
.icon svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.back { min-height: 44px; display: inline-flex; align-items: center; gap: 2px; font-size: 17px; padding-right: 8px; }
.back svg { width: 11px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
h2.title { font-size: 34px; font-weight: 600; letter-spacing: -0.6px; line-height: 1.1; margin: 0; }
.eyebrow { font-size: 12px; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--edge); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.chead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; color: var(--muted); }
.chead b { font-weight: 500; color: var(--ink); }

/* home: three zones per card (what it is, the number, the detail), number centred in the middle zone */
.cards { flex: 1; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 12px; }
.glance { container-type: inline-size; min-height: 0; text-align: left; background: var(--surface); border: 1px solid var(--edge); border-radius: 18px; padding: 16px 18px; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; box-sizing: border-box; width: 100%; }
.glance.inv { background: var(--invert); color: var(--on-invert); border-color: transparent; }
.glance .top, .glance .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.glance .top { font-size: 12px; }
.glance .top b { font-size: 15px; font-weight: 500; color: var(--ink); }
.glance .foot b { font-weight: 500; color: var(--ink); }
.glance.inv .top, .glance.inv .foot { color: var(--on-invert-muted); }
.glance.inv .top b, .glance.inv .foot b { color: var(--on-invert); }
.glance .mid { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.glance .v { font-size: min(44px, 13.5cqi); font-weight: 500; letter-spacing: -1.2px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.glance .u { font-size: 16px; font-weight: 500; letter-spacing: 0; margin-left: 4px; }
.glance .u.t { margin-left: 1px; margin-right: 2px; }
.glance .side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; font-size: 12px; color: var(--muted); }
.glance.inv .side { color: var(--on-invert-muted); }
.glance .side b { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--protein); }
.glance.inv .side b { color: var(--on-invert); }
.gpill { display: inline-flex; align-items: center; min-height: 34px; padding: 0 14px; border-radius: 999px; background: var(--on-invert); color: var(--invert); font-size: 13px; font-weight: 600; white-space: nowrap; }
.wk { display: grid; grid-template-columns: repeat(7, 16px); gap: 6px; text-align: center; font-size: 11px; color: var(--muted); }
.wk i { display: block; width: 12px; height: 12px; border-radius: 50%; margin: 4px auto 0; box-shadow: inset 0 0 0 1.5px var(--track); }
.wk i.on { background: var(--ink); box-shadow: none; }
.wk i.today { box-shadow: inset 0 0 0 1.5px var(--ink); }
.wk i.future { box-shadow: none; }

/* food */
.phone.cam { background: var(--camera); }
.phone.cam .status { background: var(--camera); color: var(--on-camera); }
.scr.camera { padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.plate { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.plate div { width: 236px; height: 236px; border-radius: 50%; background: var(--plate); box-shadow: 0 0 0 11px var(--plate-rim); position: relative; }
.plate span { position: absolute; border-radius: 42%; }
.camrow { position: relative; display: flex; justify-content: space-between; align-items: center; }
.disc { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); color: var(--ink); display: grid; place-items: center; }
.disc svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linejoin: round; }
.strip { position: relative; display: flex; justify-content: space-between; gap: 8px; padding: 9px 14px; border-radius: 999px; background: var(--scrim); color: var(--on-camera); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
.search { position: relative; height: 44px; border-radius: 999px; background: var(--surface); color: var(--muted); display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 15px; width: 100%; box-sizing: border-box; }
.search svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.shutter { width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--on-camera); display: grid; place-items: center; box-sizing: border-box; }
.shutter::after { content: ""; width: 58px; height: 58px; border-radius: 50%; background: var(--on-camera); }
.smallpill { min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--surface); font-size: 15px; font-weight: 500; }
.sheetbg { position: absolute; inset: 0; background: var(--scrim); z-index: 3; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 96px; z-index: 4; background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 16px 18px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; scrollbar-width: none; }
.grab { align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--track); flex: none; }
.tot { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 8px; }
.tot b { display: block; white-space: nowrap; font-size: 26px; font-weight: 500; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.tot b small { font-size: 13px; letter-spacing: 0; margin-left: 3px; font-weight: 500; }
.tot span { font-size: 12px; color: var(--muted); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 12px; border-radius: 12px; background: var(--raised); }
.item .nm { font-size: 16px; font-weight: 600; text-decoration: underline; text-decoration-color: var(--track); text-underline-offset: 3px; text-align: left; }
.item .meta { grid-column: 1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.qty { grid-row: 1 / span 2; grid-column: 2; display: grid; grid-template-columns: 44px 36px 44px; align-items: center; text-align: center; font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.qty button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--track); font-size: 20px; font-weight: 600; }
.primary { min-height: 52px; border-radius: 999px; background: var(--invert); color: var(--on-invert); font-size: 17px; font-weight: 600; width: 100%; flex: none; }
.secondary { min-height: 44px; border-radius: 999px; background: var(--raised); font-size: 15px; font-weight: 600; width: 100%; flex: none; }
.meal { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; }
.meal + .meal { border-top: 1px solid var(--track); padding-top: 12px; }
.thumb { width: 44px; height: 44px; border-radius: 10px; background: var(--plate); position: relative; overflow: hidden; }
.thumb i { position: absolute; border-radius: 40%; }
.meal .t { font-size: 15px; font-weight: 600; }
.meal .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.meal .r { text-align: right; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.4; }

/* workout */
.inv-card { background: var(--invert); color: var(--on-invert); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.inv-card .l { font-size: 12px; color: var(--on-invert-muted); }
.inv-card h3 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.4px; line-height: 1.1; }
.inv-card .ex { font-size: 13px; color: var(--on-invert-muted); line-height: 1.5; }
.inv-btn { min-height: 52px; border-radius: 999px; background: var(--on-invert); color: var(--invert); font-size: 17px; font-weight: 600; width: 100%; }
.out-btn { min-height: 52px; padding: 0 20px; border-radius: 999px; border: 1px solid currentColor; font-size: 17px; font-weight: 600; }
.lhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.lmeta { display: flex; flex-direction: column; gap: 3px; }
.lmeta .s { font-size: 15px; }
.rest { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 14px; border-radius: 12px; background: var(--rest-bg); }
.rest b { font-size: 28px; font-weight: 500; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.rest span { font-size: 12px; color: var(--on-invert-muted); }
.rest .adj { display: flex; gap: 6px; }
.rest .adj button { min-height: 36px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--on-invert-muted); font-size: 13px; font-weight: 600; }
.stepper { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px; }
.stepper button { width: 48px; height: 48px; border-radius: 50%; border: 1px solid currentColor; font-size: 24px; font-weight: 500; line-height: 1; }
.stepper b { text-align: center; font-size: 44px; font-weight: 500; letter-spacing: -1.2px; font-variant-numeric: tabular-nums; }
.stepper b small { font-size: 15px; font-weight: 500; letter-spacing: 0; margin-left: 4px; }
.lact { display: grid; grid-template-columns: auto 1fr; gap: 12px; }
.prog { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
.prog .dots { display: flex; gap: 5px; }
.prog .dots i { width: 18px; height: 4px; border-radius: 2px; background: var(--track); }
.prog .dots i.done { background: var(--ink); }
.prog .dots i.cur { background: var(--muted); }
.setrow { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: baseline; padding: 11px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--edge); font-size: 15px; font-variant-numeric: tabular-nums; }
.setrow.next { background: transparent; border: 1px dashed var(--track); color: var(--muted); }
.setrow .m { font-size: 12px; color: var(--muted); }
.exrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; }
.exrow + .exrow { border-top: 1px solid var(--track); padding-top: 12px; }
.exrow .t { font-size: 15px; font-weight: 600; }
.exrow .sets { grid-column: 1; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.exrow .cmp { grid-row: 1 / span 2; grid-column: 2; font-size: 13px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.exrow .cmp span { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) auto 14px; gap: 10px; align-items: center; width: 100%; text-align: left; min-height: 44px; }
.trow + .trow { border-top: 1px solid var(--track); padding-top: 12px; }
.trow .t { font-size: 16px; font-weight: 600; }
.trow .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.trow .v { font-size: 12px; color: var(--muted); }


/* metric rows */
.row { display: grid; grid-template-columns: minmax(0, 1fr) 52px auto 14px; align-items: center; gap: 10px; width: 100%; text-align: left; min-height: 44px; }
.row + .row { border-top: 1px solid var(--track); padding-top: 12px; }
.row .t { font-size: 17px; font-weight: 600; line-height: 22px; }
.row .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.row .v { font-size: 17px; font-weight: 500; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.chev { width: 9px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nospark .row { grid-template-columns: minmax(0, 1fr) auto 14px; }
.nospark .sp { display: none; }
.linkrow { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 50px; padding: 0 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--edge); font-size: 15px; text-align: left; box-sizing: border-box; }
.linkrow span:last-child { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }

/* sleep */
.big { font-size: 48px; font-weight: 500; letter-spacing: -1.2px; line-height: 1; font-variant-numeric: tabular-nums; margin-top: 4px; }
.subline { font-size: 15px; margin-top: 6px; }
.usual { font-size: 13px; color: var(--muted); margin-top: 4px; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--track); font-size: 11px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kv div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kv span { font-size: 12px; color: var(--muted); }
.kv b { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.kv b small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.kv.four { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 4px 2px 0; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { font-family: var(--sans); }

/* day timeline */
.tl { position: relative; }
.tl .hr { position: absolute; left: 0; width: 34px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; transform: translateY(-6px); }
.tl .gl { position: absolute; left: 38px; right: 0; border-top: 1px solid var(--track); }
.tl .gap { position: absolute; left: 38px; right: 0; border-top: 1px dashed var(--track); }
.tl .pl { position: absolute; left: 38px; width: 78px; border-radius: 10px; background: var(--raised); padding: 5px 7px; box-sizing: border-box; overflow: hidden; font-size: 11.5px; line-height: 1.3; }
.tl .pl span { display: block; color: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.tl .ev { display: flex; flex-direction: column; justify-content: flex-start; position: absolute; left: 124px; right: 0; border-radius: 12px; background: var(--surface); border: 1px solid var(--edge); padding: 6px 10px 6px 12px; box-sizing: border-box; overflow: hidden; font-size: 13px; line-height: 1.3; text-align: left; }
.tl .ev b { font-weight: 600; }
.tl .ev span { display: block; color: var(--muted); font-size: 12px; }
.tl .ev.sleep { padding-left: 18px; }
.tl .ev .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 7px; }
.daynav { display: flex; gap: 4px; }

/* nav and toast */
.nav { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 0 18px; display: flex; justify-content: center; gap: 24px; z-index: 5; background: linear-gradient(to top, var(--ground) 62%, rgba(0, 0, 0, 0)); }
.nav[hidden] { display: none; }
.nav button { width: 58px; height: 58px; border-radius: 50%; background: var(--surface); border: 1px solid var(--edge); font-size: 12px; font-weight: 500; box-sizing: border-box; }
.nav button[aria-current="page"] { background: var(--invert); color: var(--on-invert); border-color: transparent; }
.toast { position: absolute; left: 16px; right: 16px; top: 48px; z-index: 9; background: var(--toast); color: var(--on-toast); border-radius: 999px; padding: 12px 18px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

/* panel */
.panel { flex: 1 1 300px; min-width: 0; max-width: 520px; }
.panel h3 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
.panel .lede { font-size: 13px; color: var(--muted); margin: 0 0 14px; line-height: 1.5; }
.panel ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.panel li { font-size: 13.5px; line-height: 1.5; padding-left: 14px; position: relative; }
.panel li::before { content: ""; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
.panel li b { font-weight: 600; }
.panel .foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="page">

<script>

  /* Day: hours with something on them get full height; empty hours shrink. */

    if (!other) {

      hH.push(busy ? 34 : 10);

    });
    ev.forEach(function (e) {

        stripe = '<i class="stripe" style="background:linear-gradient(to bottom,' + grad + ')"></i>';

      s += '<button class="ev' + (e.kind === "sleep" ? " sleep" : "") + '" style="top:' + (a + 1) + "px;height:" + hgt + 'px" ' + (e.kind === "sleep" ? 'data-go="sleep"' : 'data-toast="Edit or delete lives here (S-025)"') + ">" + stripe + "<b>" + e.t + "</b><span>" + e.sub + "</span></button>";

      "<b>Energy and protein as ranges,</b> big, in their data colours.",
      "<b>Each meal</b> has its photo, time, items and ranges. Tap to edit servings or delete (S-019).",
      "<b>This week</b> draws each day as a low-to-high band. The missing day is a dashed slot; today says 'so far'.",
      "<b>No target, ring or 'remaining'</b> anywhere (D-032)."]],
    workout: ["Workout", "Start the next session in one tap; see the week without opening anything.", [
      "<b>The black card is the next template</b> with its exercises and a full-width Start.",
      "<b>This week</b> uses the same day dots as the Home card, so the two read alike.",
      "<b>Other days</b> show when each was last done, so picking out of order is an informed choice.",
      "<b>Import program</b> is a quiet row: used once."]],
    logger: ["Workout: logger", "One tap per set. Nothing on this screen moves while you train.", [
      "<b>Log sits at the bottom of the black card</b> and never moves. Try it: Log starts a 90 s rest inside the card, above the steppers.",
      "<b>Rest has -15, +15 and Skip</b> right where the countdown is.",
      "<b>The next set shows last time's numbers</b> as a dashed row: what to beat, not a target. Logged sets stack under it, newest first.",
      "<b>Progress across exercises</b> is a thin bar of segments, with the next exercise named under the list.",
      "<b>The area nav is hidden here</b> so a stray tap can't leave the session. Finish (top right) saves and opens the summary."]],
    summary: ["Workout: summary", "What you did, next to what you did last time. This is where strength progress lives.", [
      "<b>Three numbers:</b> duration, working sets, volume, and whether it reached Health.",
      "<b>Per exercise:</b> every set, then the best set compared with the last Legs session ('+5 lb', 'same', '-1 rep'), in plain ink: no green or red.",
      "<b>History, not advice:</b> no 'add 5 lb next time' in v1 (D-032)."]],
    data: ["This week", "One question per screen: how is my week? Monday to Sunday, as D-033 defines it.", [
      "<b>Cards have headers.</b> 'Recovery' carries one 'context only' tag instead of three, and 'Breathing' fits on one line.",
      "<b>Weight and Steps come back,</b> first. Weight is the metric the weekly rule uses.",
      "<b>Every row has a chevron.</b> Only Sleep is wired in this mock; the rest show a note.",
      "<b>Food is a range</b> (1,980–2,320 kcal) in the energy colour. Workouts shows working sets instead of repeating the count.",
      "<b>Places shows visits as its value;</b> coverage moves to the subtitle.",
      "<b>Sparklines:</b> the line is lighter and only today gets a dot; missing days are a dashed slot, not a near-zero tick. Compare with 'Numbers only'.",
      "<b>Sources is a quiet row,</b> not a full-width button."]],
    sleep: ["Sleep", "Answers why. Order: last night's number, the pattern across nights, then the stages of the night you picked.", [
      "<b>The window comes first</b> and fixes at 14 nights. The 7/14/30 switch is gone.",
      "<b>One naming rule:</b> nights are named by the wake day everywhere (header, window, day link).",
      "<b>The usual lines carry their own labels</b> at the top, so the caption explaining the chart is gone.",
      "<b>Wake-ups are the warmest mark</b> on the chart, and the count is written out under it.",
      "<b>Stage times sit on the lanes;</b> the separate legend is gone. 'Estimated by the strap' sits next to the chart, not in the footer.",
      "<b>Heart rate and breathing are one line</b> of three numbers; the two range charts are gone. The screen is about a third shorter."]],
    day: ["Day", "The view no other app has: sleep, food, training and places on one timeline.", [
      "<b>Sleep is not the black block.</b> It is a normal card with a stripe of its stages, so black still means 'do this next'.",
      "<b>Empty hours fold</b> to a thin band, so the busy parts of the day get the space.",
      "<b>Places have names</b> (resolved on the phone; the repo stays generic).",
      "<b>The steps lane is gone;</b> the day's totals sit in the summary at the top.",
      "<b>Previous and next day</b> arrows next to the title, so comparing days is one tap.",
      "<b>Tapping sleep goes back to that night;</b> tapping a meal or the workout is where edit and delete live (S-025)."]]
  };

  /* ---------- render ---------- */
  var $ = function (id) { return document.getElementById(id); };
  function render() {
    var scr = $("scr");
    scr.className = "scr" + (S.screen === "home" ? " home" : S.screen === "camera" ? " camera" : "");
    $("phone").classList.toggle("cam", S.screen === "camera");
    scr.innerHTML = { home: home, data: data, sleep: sleep, day: day, camera: camera, foodday: foodday, workout: workout, logger: logger, summary: summary }[S.screen]();
    var nav = $("nav"), area = { data: "Data", sleep: "Data", day: "Data", foodday: "Food", workout: "Workout", summary: "Workout" }[S.screen];
    nav.hidden = !area;
    nav.innerHTML = [["Data", "data"], ["Food", "camera"], ["Workout", "workout"]].map(function (t) { return "<button" + (t[0] === area ? ' aria-current="page"' : "") + ' data-go="' + t[1] + '">' + t[0] + "</button>"; }).join("");
    var p = P[S.screen];
    $("ph").textContent = p[0]; $("pl").textContent = p[1]; $("pc").innerHTML = p[2].map(function (x) { return "<li>" + x + "</li>"; }).join("");
    $("taps").textContent = "Taps from Home: " + S.taps;
    [].forEach.call(document.querySelectorAll("#jump button"), function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-jump") === S.screen); });
    [].forEach.call(document.querySelectorAll("#spk button"), function (b) { b.setAttribute("aria-pressed", (b.getAttribute("data-spk") === "1") === S.spark); });
    [].forEach.call(document.querySelectorAll("#thm button"), function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-thm") === S.theme); });
    if (S.theme === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", S.theme);
  }
  var tt;
  function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove("show"); }, 1800); }
  function act(el) {
    if (el.hasAttribute("data-reset")) S.taps = 0; else S.taps++;
    if (el.hasAttribute("data-night")) { S.sel = el.getAttribute("data-night"); render(); return; }
    if (el.hasAttribute("data-day")) { S.sel = el.getAttribute("data-day"); render(); return; }
    if (el.hasAttribute("data-toast")) { S.taps--; toast(el.getAttribute("data-toast")); return; }
    if (el.hasAttribute("data-sheet")) { S.sheet = el.getAttribute("data-sheet") === "1"; if (S.sheet) S.items = freshItems(); render(); return; }
    if (el.hasAttribute("data-serv")) { var sv = el.getAttribute("data-serv").split(":"), it = S.items[+sv[0]]; it.s = Math.max(0.5, it.s + 0.5 * +sv[1]); render(); return; }
    if (el.hasAttribute("data-logmeal")) {
      var tt = itemTotals();
      S.meals = S.meals.filter(function (m) { return m.id !== "l"; }).concat([{ id: "l", t: "12:12", name: "Lunch", items: S.items.map(function (x) { return x.n; }).join(", "), k: [Math.round(tt.k[0] / 10) * 10, Math.round(tt.k[1] / 10) * 10], p: [Math.round(tt.p[0]), Math.round(tt.p[1])] }]);
      S.sheet = false; render(); toast("Lunch logged, in Health"); return;
    }
    if (el.hasAttribute("data-step")) { var st = el.getAttribute("data-step").split(":"); if (st[0] === "w") S.lg.w = Math.max(0, S.lg.w + +st[1]); else S.lg.r = Math.max(1, S.lg.r + +st[1]); render(); return; }
    if (el.hasAttribute("data-logset")) {
      var L = S.lg, e = TPL.ex[L.ex];
      L.done.push({ ex: L.ex, n: L.set, w: L.w, r: L.r });
      if (L.set >= e.sets && L.ex + 1 < TPL.ex.length) { L.ex++; L.set = 1; L.w = TPL.ex[L.ex].last[0]; L.r = TPL.ex[L.ex].last[1]; } else if (L.set < e.sets) L.set++;
      S.restEnd = Date.now() + 90000; render(); return;
    }
    if (el.hasAttribute("data-rest")) { var r = +el.getAttribute("data-rest"); S.restEnd = r === 0 ? 0 : S.restEnd + r * 1000; render(); return; }
    if (el.hasAttribute("data-finish")) { S.restEnd = 0; S.screen = "summary"; render(); $("scr").scrollTop = 0; toast(S.lg.done.length ? "Legs saved, in Health" : "Example sets filled in for the summary"); return; }
    var go = el.getAttribute("data-go");
    if (go && go !== S.screen) { S.screen = go; render(); $("scr").scrollTop = 0; }
  }
  $("phone").addEventListener("click", function (e) { var el = e.target.closest("[data-go],[data-night],[data-day],[data-toast],[data-sheet],[data-serv],[data-logmeal],[data-step],[data-logset],[data-rest],[data-finish]"); if (el) act(el); });
  $("phone").addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && e.target.hasAttribute("data-night")) { e.preventDefault(); act(e.target); } });
  document.querySelector(".tool").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.hasAttribute("data-jump")) { S.screen = b.getAttribute("data-jump"); S.taps = 0; S.sheet = false; $("scr").scrollTop = 0; }
    if (b.hasAttribute("data-spk")) S.spark = b.getAttribute("data-spk") === "1";
    if (b.hasAttribute("data-thm")) { S.theme = b.getAttribute("data-thm"); try { localStorage.setItem("ingest-mock-theme", S.theme); } catch (err) {} }
    render();
  });
  setInterval(function () {
    if (S.screen !== "logger" || !S.restEnd) return;
    var el = document.getElementById("restT");
    if (restLeft() <= 0) { S.restEnd = 0; render(); return; }
    if (el) el.textContent = mmss(restLeft());
  }, 1000);
  var FLOW = window.INGEST_FLOW;
  if (FLOW) {
    S.screen = FLOW.start;
    document.getElementById("flowname").textContent = FLOW.name;
    [].forEach.call(document.querySelectorAll("#jump button"), function (b) { b.hidden = FLOW.screens.indexOf(b.getAttribute("data-jump")) < 0; });
  }
  render();
})();
</script>
