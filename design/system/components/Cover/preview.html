<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script>
<meta charset="utf-8">
<title>Ingest</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; left: 480px; top: 0; width: 480px; height: 288px; }
  .art svg { display: block; }
  .card { fill: var(--surface); stroke: var(--edge); stroke-width: 1; rx: var(--radius-card); }
  .inv { fill: var(--invert); rx: var(--radius-card); }
  .bar { rx: 4px; }
  .ink { fill: var(--ink); }
  .energy { fill: var(--data-energy); }
  .protein { fill: var(--data-protein); }
  .heart { fill: var(--data-heart); }
  .absent { fill: none; stroke: var(--track); stroke-width: 1.5; stroke-dasharray: 4 4; rx: 4px; }
  .base { stroke: var(--track); stroke-width: 1; }
  .words { position: absolute; left: var(--space-xl); bottom: var(--space-xl); max-width: 440px; }
  .name { margin: 0; font-size: 120px; line-height: .92; font-weight: 600; letter-spacing: -3px; }
  .tag { margin: 20px 0 0 4px; font-size: 14px; line-height: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocks      invert 208x76 (the one black card) between two surface 208x76 cards, the Home screen and app icon; week bars in ink, data-protein, data-energy, data-heart, 16 wide
        arrangement left: the three stacked Home cards, bleeding off the top and bottom; right: a week of bars on one baseline, oldest left
        pattern     WeekBars, from "Every number is a door" and "Absent is not zero": eight bars at a space-xl + 4 pitch, one dashed absent slot, the newest at full ink
        scales      cards radius-card, gaps space-md; bars radius 4, pitch 28 (space-xl + space-xs); inset space-xl
      -->
      <rect class="card" x="24" y="-40" width="208" height="76" rx="18"/>
      <rect class="inv" x="24" y="48" width="208" height="76" rx="18"/>
      <rect class="card" x="24" y="136" width="208" height="76" rx="18"/>
      <rect class="card" x="24" y="224" width="208" height="76" rx="18"/>
      <line class="base" x1="256" x2="472" y1="248" y2="248"/>
      <rect class="bar protein" x="262" y="152" width="16" height="96" rx="4"/>
      <rect class="bar protein" x="290" y="128" width="16" height="120" rx="4"/>
      <rect class="bar energy" x="318" y="144" width="16" height="104" rx="4"/>
      <rect class="absent" x="346" y="216" width="16" height="32" rx="4"/>
      <rect class="bar energy" x="374" y="108" width="16" height="140" rx="4"/>
      <rect class="bar heart" x="402" y="120" width="16" height="128" rx="4"/>
      <rect class="bar heart" x="430" y="136" width="16" height="112" rx="4"/>
      <rect class="bar ink" x="458" y="96" width="16" height="152" rx="4"/>
    </svg>
  </div>
  <div class="words">
    <p class="name">Ingest</p>
    <p class="tag">Log in one tap. Read as deep as you want.</p>
  </div>
</div>
</body>
</html>
