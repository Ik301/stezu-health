<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><meta charset="utf-8"><title>Hypnogram</title></head>
<body>
<div class="ig-demo"><div class="ig-well" style="width:360px">
  <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="t-stat" id="asleep"></span><span class="ig-tag">context</span></div>
  <span class="t-label ig-muted">23:12 to 07:41, Health, Zepp</span>
  <div class="ig-chart" id="h"></div>
  <div class="ig-kv" id="kv"></div>
</div></div>
<script>
Ingest.hydrate(); Ingest.iconAll();
var segs=Ingest.synthNight(11), tot=Ingest.stageTotals(segs), end=segs[segs.length-1].b;
Ingest.hypnogram('#h',segs,{ticks:[{m:48,l:"00:00"},{m:168,l:"02:00"},{m:288,l:"04:00"},{m:408,l:"06:00"},{m:468,l:"07:00"}],label:'Sleep stages last night'});
function hm(m){return Math.floor(m/60)+'h '+Math.round(m%60)+'m';}
document.getElementById('asleep').textContent=hm(end-tot.awake)+' asleep';
document.getElementById('kv').innerHTML=['deep','core','rem'].map(function(s){return '<div><span class="t-label ig-muted">'+({deep:'Deep',core:'Core',rem:'REM'})[s]+'</span><span class="t-value">'+hm(tot[s])+'</span></div>';}).join('');
</script>
</body>
</html>
