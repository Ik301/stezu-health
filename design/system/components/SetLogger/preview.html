<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><meta charset="utf-8"><title>SetLogger</title></head>
<body>
<div class="ig-demo">
  <div class="ig-card ig-card--invert ig-card--big ig-logger" style="width:320px">
    <div class="ig-logger-head">
      <div class="ig-logger-meta"><span class="t-title-2">Bench press</span><span class="t-subtitle">Set 3 of 4</span><span class="t-label">6–8 reps, last 135 x 8, 7d ago</span></div>
      <button class="ig-iconbtn" style="color:var(--on-invert)" aria-label="Exercise menu" data-icon="more"></button>
    </div>
    <div class="ig-rest-inline"><span class="t-label">Rest</span><span class="t-stat">1:24</span><button class="ig-textbtn" style="color:var(--on-invert);min-height:32px">Skip</button></div>
    <div class="ig-stepper"><button class="ig-stepper-btn">-</button><span class="ig-stepper-val t-big">135<span class="ig-stepper-unit">lb</span></span><button class="ig-stepper-btn">+</button></div>
    <div class="ig-stepper"><button class="ig-stepper-btn">-</button><span class="ig-stepper-val t-big">8<span class="ig-stepper-unit">reps</span></span><button class="ig-stepper-btn">+</button></div>
    <div class="ig-logger-actions"><button class="ig-pill ig-pill--outline">BW</button><button class="ig-pill ig-pill--primary">Log</button></div>
  </div>
</div>
<script>
Ingest.hydrate(); Ingest.iconAll();

</script>
</body>
</html>
