<!-- @dsCard group="Logging" height=300 -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><meta charset="utf-8"><title>MealItem</title></head>
<body>
<div class="ig-demo"><div class="ig-col">
  <div class="ig-item">
    <button class="ig-item-name">Grilled chicken</button>
    <div class="ig-item-qty"><button class="ig-qty-btn" aria-label="Fewer servings">-</button><span class="t-value">1.5</span><button class="ig-qty-btn" aria-label="More servings">+</button></div>
    <div class="ig-item-sub"><span class="ig-tag">Hall A</span><span class="t-label" style="color:var(--data-energy)">310–380 kcal</span><span class="t-label" style="color:var(--data-protein)">42–50 g</span></div>
  </div>
  <div class="ig-item">
    <button class="ig-item-name">Brown rice</button>
    <div class="ig-item-qty"><button class="ig-qty-btn">-</button><span class="t-value">1</span><button class="ig-qty-btn">+</button></div>
    <div class="ig-item-sub"><span class="ig-tag">Hall C</span><span class="t-label" style="color:var(--data-energy)">200–240 kcal</span><span class="t-label" style="color:var(--data-protein)">4–6 g</span></div>
  </div>
  <div class="ig-item">
    <button class="ig-item-name">Side salad</button>
    <div class="ig-item-qty"><button class="ig-qty-btn">-</button><span class="t-value">1</span><button class="ig-qty-btn">+</button></div>
    <div class="ig-item-sub"><span class="ig-tag">Text estimate</span><span class="t-label" style="color:var(--data-energy)">60–140 kcal</span><span class="t-label" style="color:var(--data-protein)">1–4 g</span></div>
  </div>
  <button class="ig-pill ig-pill--secondary">+ Add item</button>
</div></div>
<script>
Ingest.hydrate(); Ingest.iconAll();

</script>
</body>
</html>
