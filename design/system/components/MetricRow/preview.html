<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><meta charset="utf-8"><title>MetricRow</title></head>
<body>
<div class="ig-demo"><div class="ig-card" style="width:360px"><div class="ig-rows">
<button class="ig-row">
  <span><span class="ig-row-title"><span class="t-headline">Weight</span></span>
  <span class="ig-row-sub"><span data-dots="1101111"></span><span class="t-label ig-muted">6 of 7</span></span></span>
  <span data-spark="172.9,172.6,-,172.8,172.3,172.4,172.1" data-color="ink" aria-label="Weight trend, falling 0.3 lb"></span>
  <span class="t-value ig-row-val">172.4 lb</span>
  <svg class="ig-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</button>
<button class="ig-row">
  <span><span class="ig-row-title"><span class="t-headline">Steps</span></span>
  <span class="ig-row-sub"><span data-dots="1111111"></span><span class="t-label ig-muted">7 of 7</span></span></span>
  <span data-spark="6200,9100,7400,10200,5300,11800,6900" data-color="ink" data-bars aria-label="Steps last 7 days"></span>
  <span class="t-value ig-row-val">8,140</span>
  <svg class="ig-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</button>
<button class="ig-row">
  <span><span class="ig-row-title"><span class="t-headline">Food</span></span>
  <span class="ig-row-sub"><span data-dots="1110110"></span><span class="t-label ig-muted">5 of 7</span></span></span>
  <span data-spark="2100,2250,1980,-,2400,2050,-" data-color="data-energy" aria-label="Food last 7 days"></span>
  <span class="t-value ig-row-val">1,980–2,320</span>
  <svg class="ig-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</button>
<button class="ig-row">
  <span><span class="ig-row-title"><span class="t-headline">Sleep</span><span class="ig-tag">context</span></span>
  <span class="ig-row-sub"><span data-dots="1111011"></span><span class="t-label ig-muted">6 of 7</span></span></span>
  <span data-spark="7.1,6.8,7.6,7.3,-,7.9,6.9" data-color="ink" aria-label="Sleep last 7 days"></span>
  <span class="t-value ig-row-val">7h 12m</span>
  <svg class="ig-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</button>
<button class="ig-row">
  <span><span class="ig-row-title"><span class="t-headline">HRV</span><span class="ig-tag">context</span></span>
  <span class="ig-row-sub"><span class="t-label ig-muted">31 samples</span></span></span>
  <span data-spark="44,51,47,49,52,46,48" data-color="ink" aria-label="HRV last 7 days"></span>
  <span class="t-value ig-row-val">48 ms</span>
  <svg class="ig-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</button>
<button class="ig-row">
  <span><span class="ig-row-title"><span class="t-headline">Resting HR</span></span>
  <span class="ig-row-sub"><span data-dots="1111111"></span><span class="t-label ig-muted">7 of 7</span></span></span>
  <span data-spark="58,57,57,56,58,57,56" data-color="ink" aria-label="Resting HR last 7 days"></span>
  <span class="t-value ig-row-val">57 bpm</span>
  <svg class="ig-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</button>
<button class="ig-row">
  <span><span class="ig-row-title"><span class="t-headline">Temperature</span><span class="ig-tag">context</span></span>
  <span class="ig-row-sub"><span data-dots="0000000"></span><span class="t-label ig-muted">0 of 7</span></span></span>
  <span></span>
  <span class="t-value ig-row-val">--</span>
  <svg class="ig-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</button>
</div></div></div>
<script>
Ingest.hydrate(); Ingest.iconAll();

</script>
</body>
</html>
