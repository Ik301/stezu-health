name: StezuHealth
options:
  bundleIdPrefix: com.ik301
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  StezuCore:
    path: Packages/StezuCore
targets:
  StezuHealth:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App/Sources
      - App/Shared
    dependencies:
      - package: StezuCore
        product: StezuCore
      - target: RestActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ik301.stezuhealth
        CODE_SIGN_ENTITLEMENTS: App/StezuHealth.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ingest
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Ingest reads weight, steps, sleep, heart rate variability, resting heart rate and workouts from Apple Health to show your week."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Ingest saves your weigh-ins, logged meals and strength workouts to Apple Health."
        INFOPLIST_KEY_NSCameraUsageDescription: "Ingest uses the camera to photograph meals and scan food barcodes."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - AppTests
        - AppUITests
  RestActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/RestActivity
        excludes:
          - Info.plist
      - App/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ik301.stezuhealth.RestActivity
        INFOPLIST_FILE: App/RestActivity/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ingest Rest
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  AppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App/Tests
    dependencies:
      - target: StezuHealth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ik301.stezuhealth.tests
        GENERATE_INFOPLIST_FILE: YES
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App/UITests
    dependencies:
      - target: StezuHealth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ik301.stezuhealth.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StezuHealth
